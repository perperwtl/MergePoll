services:
  mergepoll:
    build: .
    ports:
      - "127.0.0.1:${MERGEPOLL_PORT:-5173}:5173"
    # Read credentials only from this deployer's file, not the invoking shell.
    env_file:
      - path: .env
        required: false
    volumes:
      - mergepoll-data:/app/.wrangler/state
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  mergepoll-data:
