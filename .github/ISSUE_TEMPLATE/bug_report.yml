name: Bug report
description: Help reproduce something that does not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security issues, email perperwtl@gmail.com. Never include API keys or private participant data."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe expected behavior and what you observed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the room…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Commit/version, OS, Node version, browser, local or hosted"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove secrets and identifying information before attaching.
