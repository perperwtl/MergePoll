name: Feature request
description: Suggest a concrete improvement to MergePoll.
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
      description: Describe the organizer or participant workflow.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: Include alternatives or examples if useful.
    validations:
      required: true
